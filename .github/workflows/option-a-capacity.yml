name: Option A capacity checks
on:
  push:
    branches:
      - feature/service-capacity-option-a
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fyp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fyp-backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx jest src/common/utils/service-capacity.spec.ts src/vendor/vendor.service.spec.ts --runInBand
      - run: npm test -- --runInBand
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fyp-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fyp-mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fyp-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fyp-admin/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
